name: Fetch Persephone Theatre Events

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 1' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "persephonetheatre-org"
          artifact-file: "output/persephonetheatre-org-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://persephonetheatre.org/tribe_events-sitemap.xml"
          entity-identifier: "loc"
          skolemization-exclude: '{"http://schema.org/Place":["http://schema.org/sameAs"]}'
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
