name: Fetch spec.qc.ca Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 3'
jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "spec-qc-ca-events"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          artifact-file: "output/spec-qc-ca-events.jsonld"
          page-url: "https://spec.qc.ca/sitemaps-1-section-spectacles-1-sitemap.xml"
          entity-identifier: "loc"
          custom-sparql: "https://raw.githubusercontent.com/culturecreates/artsdata-orion/main/sparql/spec-qc-ca-events.sparql"
          html-extract-config: |
            {
              "entity_type": "https://github.com/culturecreates/artsdata-orion#Page",
              "extract": {
                "https://github.com/culturecreates/artsdata-orion#discipline": {"xpath": "(//a[contains(@class,\"content__head-link\")]/@href)[1]"}
              }
            }
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
