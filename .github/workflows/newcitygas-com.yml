name: Fetch New City Gas Events
# New City Gas, Montreal. Only upcoming events are fetched, from the French
# events page (/evenements/), which links each one with an a.grid-item-card.
# (The Rank Math "ncgevent" sitemaps also list past events, which are never
# minted.) The English pages (/en/event/...) are not fetched: the action does
# not merge them with the French ones (see the artsdata-pipeline skill).

on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 4' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "newcitygas-com"
          artifact-file: "output/newcitygas-com-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://newcitygas.com/evenements/"
          entity-identifier: "a.grid-item-card"
          custom-sparql: "https://raw.githubusercontent.com/culturecreates/artsdata-orion/main/sparql/newcitygas-com.sparql"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
