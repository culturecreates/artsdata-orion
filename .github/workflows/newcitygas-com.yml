name: Fetch New City Gas Events
# New City Gas, Montreal. Events are listed in the Rank Math "ncgevent" sitemaps.
# Each event has a French page (/event/...) and an English page (/en/event/...)
# with the same JSON-LD but a different url, so only the French pages are fetched
# to avoid duplicate events.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 4' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "newcitygas-com"
          artifact-file: "output/newcitygas-com-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://newcitygas.com/ncgevent-sitemap1.xml,https://newcitygas.com/ncgevent-sitemap2.xml,https://newcitygas.com/ncgevent-sitemap3.xml"
          entity-identifier: "//*[local-name()='loc'][not(contains(., '/en/'))]"
          custom-sparql: "https://raw.githubusercontent.com/culturecreates/artsdata-orion/claude/orion-newcitygas-workflow-3ke6d7/sparql/newcitygas-com.sparql"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
