name: Fetch VOIR (L'actualité) Events

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 4' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "voir-lactualite-com"
          artifact-file: "output/voir-lactualite-com-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://voir.lactualite.com/sitemaps/events.xml"
          entity-identifier: "loc"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
