name: Fetch Market Hall Performing Arts Centre Events

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 3' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "markethall-org"
          artifact-file: "output/markethall-org-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://markethall.org/events"
          urls-are-entities: true
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
