name: Fetch ISNI Entities

# Fetches the ISNI record of every ISNI Artsdata links to (schema:sameAs) with
# src/isni/main.py, converts it to schema.org, commits it to
# output/isni-entities.ttl and registers it on the Artsdata Databus.
# ISNI limits how many records an IP address can retrieve; when a run hits
# that limit, the script keeps the previous data for the ISNIs it couldn't
# fetch and the next weekly run refreshes them.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0' # weekly

jobs:

  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/isni/requirements.txt

      - name: Fetch data
        run: python ./src/isni/main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "output/isni-entities.ttl"
          # Only commit and push if there are actual modified or new files staged
          if ! git diff --cached --quiet; then
            git commit -m "Added isni-entities generated."
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in isni-entities.ttl. Skipping commit."
          fi

  artsdata-push:
    runs-on: ubuntu-latest
    needs: fetch-and-push
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "push"
          artifact: "isni-org"
          group: "artsdata-orion-api"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: "https://raw.githubusercontent.com/${{github.repository}}/${{github.ref_name}}/output/isni-entities.ttl"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
