name: Fetch Crow's Theatre Events

# crowstheatre.com publishes no Event JSON-LD, so instead of crawling pages this
# converts the site's schedule pages to schema.org with
# src/crowstheatre/main.py, commits the result to output/, and registers it on
# the Artsdata Databus.
#
# Note: Crow's Theatre events also reach Artsdata through Footlight
# (graph http://kg.artsdata.ca/culture-creates/footlight/crowstheatre-com).
# That graph is kept for now, to compare the two. Keep auto-minting off for
# http://kg.artsdata.ca/culture-creates/artsdata-orion-api/crowstheatre-com
# until one of them is retired.

on:
  workflow_dispatch:
    inputs:
      allow-drop:
        description: 'Accept a sharp drop in the number of events'
        type: boolean
        default: false
  schedule:
    - cron: '41 5 * * 1' # weekly

jobs:
  fetch-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/crowstheatre/requirements.txt

      - name: Fetch and convert schedule
        run: python ./src/crowstheatre/main.py ${{ inputs.allow-drop && '--allow-drop' || '' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "output/crowstheatre-com-events.jsonld"
          if ! git diff --cached --quiet; then
            git commit -m "Add data generated by the script"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in crowstheatre-com-events.jsonld. Skipping commit."
          fi

  artsdata-push:
    runs-on: ubuntu-latest
    needs: fetch-and-convert
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "push"
          artifact: "crowstheatre-com"
          group: "artsdata-orion-api"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output/crowstheatre-com-events.jsonld"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
