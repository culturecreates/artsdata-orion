name: Fetch LeVivier Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 2'
      
jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "levivier-ca"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          artifact-file: "output/levivier-events.jsonld"
          # Season listing; update the season slug each year (e.g. saison-2027-28).
          page-url: "https://levivier.ca/fr/concerts/saison-2026-27"
          entity-identifier: "a.ev-avenir"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
