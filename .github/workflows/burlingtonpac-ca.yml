name: Fetch Burlington Performing Arts Centre Events

on:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 4' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "burlingtonpac-ca-website"
          artifact-file: "output/burlingtonpac-ca-website-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://burlingtonpac.ca/tribe_events-sitemap.xml"
          entity-identifier: "loc"
          custom-sparql: "https://raw.githubusercontent.com/culturecreates/artsdata-orion/main/sparql/burlingtonpac-ca.sparql"
          html-extract-config: |
            {
              "entity_type": "http://schema.org/Event",
              "extract": {
                "http://schema.org/description": {
                  "xpath": "//meta[@name=\"description\"]/@content"
                },
                "https://github.com/culturecreates/artsdata-orion#ticketUrl": {
                  "xpath": "//a[contains(@class,\"bpac-ticket-btn\")]/@href",
                  "uri": "true"
                }
              }
            }
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
