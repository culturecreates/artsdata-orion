name: Fetch Culture Trois-Rivières Events

# culture3r.com publishes no Event JSON-LD, so instead of crawling pages this
# converts the site's programmation feed (admin-ajax.php?action=dates) to
# schema.org with src/culture3r/main.py, commits the result to output/, and
# registers it on the Artsdata Databus.
#
# Note: Culture Trois-Rivières events also reach Artsdata through Footlight
# (graph http://kg.artsdata.ca/culture-creates/footlight/culture3r-com).
# This workflow is an alternative source; keep only one of the two.

on:
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * 4' # weekly

jobs:
  fetch-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/culture3r/requirements.txt

      - name: Fetch and convert feed
        run: python ./src/culture3r/main.py --save-feed dates.json --drift-report drift.json

      # drift.json only exists when the feed or pages need a code change (an
      # unmapped venue or category, a changed feed or page). Its upload starts
      # culture3r-heal.yml, which has Claude open a PR with the fix.
      - name: Upload drift report
        if: always() && hashFiles('drift.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: culture3r-drift
          path: |
            drift.json
            dates.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "output/culture3r-com-events.jsonld"
          if ! git diff --cached --quiet; then
            git commit -m "Add data generated by the script"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in culture3r-com-events.jsonld. Skipping commit."
          fi

  artsdata-push:
    runs-on: ubuntu-latest
    needs: fetch-and-convert
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "push"
          artifact: "culture3r-com"
          group: "artsdata-orion-api"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output/culture3r-com-events.jsonld"
