name: Fetch Le Gesù Events

on:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 2' # weekly

jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "legesu-com"
          artifact-file: "output/legesu-com-events.jsonld"
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://legesu.com/tribe_events-sitemap.xml"
          entity-identifier: "loc"
          custom-sparql: "https://raw.githubusercontent.com/culturecreates/artsdata-orion/main/sparql/legesu-com.sparql"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
